name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal -c rustfmt -c clippy && rustup default stable
      - run: cargo fmt --all --check
      - uses: $/.github/actions/cross-tools
      - run: cargo clippy --target x86_64-pc-windows-gnu --all-targets --locked -- -D warnings
      - uses: $/.github/actions/cross-build
        id: build
      - name: Test under Wine
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUNNER: wine
          WINEDEBUG: -all
          WINEPATH: ${{ steps.build.outputs.simconnect-dll-dir }}
        run: cargo test --target x86_64-pc-windows-gnu --locked

  package:
    name: Build package
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: $/.github/actions/cross-tools
      - uses: $/.github/actions/cross-build
        id: release
        with:
          args: --release
      - name: Package picard.exe
        env:
          SIMCONNECT_DLL_DIR: ${{ steps.release.outputs.simconnect-dll-dir }}
        run: |
          mkdir -p target/package/picard
          cp target/x86_64-pc-windows-gnu/release/picard.exe "$SIMCONNECT_DLL_DIR/SimConnect.dll" config.toml target/package/picard/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: picard
          path: target/package
          if-no-files-found: error
